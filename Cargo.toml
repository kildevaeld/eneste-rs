[package]
name = "eneste"
version = "0.2.0"
edition = "2024"

[features]
executor = []
sink = ["futures-sink"]
std = []
compio = ["std", "dep:compio", "goerdet/compio"]

[dependencies]
futures-core = { version = "0.3", default-features = false }
pin-project-lite = { version = "0.2" }
futures-sink = { version = "0.3", default-features = false, optional = true }
goerdet = { git = "https://github.com/kildevaeld/goerdet" }

compio = { version = "0.19", optional = true }


[dev-dependencies]
pollster = "1.0"
